openapi: 3.0.1
info:
  title: TransportFleet
  description: API de gestión de flota de transportes.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
paths:
  /routes:
    get:
      summary: Lista de rutas
      description: | 
        Nos devuelve una lista completa con todas las rutas. 
        Se puede realizar búsqueda tanto de la lista completa como realizar un filtrado tanto por categoría de ruta como por nombre de la estación.
      parameters:
        - name: category
          in: query
          description: Filtra por categoría de la ruta
          required: false
          schema:
            type: string
        - name: stationName
          in: query
          description: Filtra por nombre de la estación de la ruta
          required: false
          schema:
            type: string
        - name: price
          in: query
          description: Filtra por precio inferior o igual al parámetro y los ordena ascendentemente
          required: false
          schema:
            type: number
            format: float
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteOutDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      summary: Registrar ruta
      description: Nos permite registrar una nueva ruta en nuestra base de datos.
      requestBody:
        description: Los datos de la nueva ruta
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInDto'
      responses:
        '201':
          description: Ruta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /routes/{id}:
    get:
      summary: Vista de una ruta
      description: Devuelve la vista detallada de una ruta. Búsqueda por Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      summary: Editar una ruta
      description: Modifica los datos de una ruta por Id.
      requestBody:
        description: Datos a sobreescribir.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteModifyInDto'
      responses:
        '200':
          description: Ruta modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      summary: Borrar ruta
      description: Elimina una ruta por Id.
      responses:
        '204':
          description: Ruta eliminada.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /stations:
    get:
      summary: Lista de estaciones
      description: |
        Nos devuelve una lista con todas las estaciones.
      parameters:
        - name: disabledAccess
          in: query
          description: Filtra por estaciones con acceso adaptado.
          required: false
          schema:
            type: boolean
        - name: category
          in: query
          description: Filtra por categoría
          required: false
          schema:
            type: string
        - name: postalCode
          in: query
          description: Filtra por código postal
          schema:
            type: number
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationOutDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      summary: Registrar estación
      description: Registra una estación.
      requestBody:
        description: Datos de la nueva estación
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Station'
      responses:
        '201':
          description: Estación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
