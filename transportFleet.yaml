  /users:
    get:
      summary: Lista de usuarios
      description: Nos devuelve una lista con todos los usuarios.
      parameters:
        - name: name
          in: query
          description: Filtra por nombre
          required: false
          schema:
            type: string
        - name: date
          in: query
          description: Filtra por fecha de nacimiento
          required: false
          schema:
            type: string
            format: date
        - name: active
          in: query
