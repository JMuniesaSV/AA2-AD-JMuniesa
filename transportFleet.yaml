components:
  schemas:
    Route:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        routeDate:
          type: string
          format: date
        category:
          type: string
        capacity:
          type: integer
        price:
          type: number
          format: float
        availability:
          type: boolean
    RouteInDto:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
        description:
          type: string
        routeDate:
          type: string
          format: date
        category:
          type: string
        capacity:
          type: integer
        price:
          type: number
          format: float
        stationId:
          type: integer
          format: int64
        driversIds:
          type: array
          items:
            type: integer
            format: int64
    RouteModifyInDto:
      allOf:
        - $ref: '#/components/schemas/RouteInDto'
      type: object
      properties:
        availability:
          type: boolean
    RouteOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        routeDate:
          type: string
          format: date
        category:
          type: string
        capacity:
          type: integer
        price:
          type: number
          format: float
        availability:
          type: boolean
    Station:
      type: object
      required:
        - name
        - category
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        category:
          type: string
        streetLocated:
          type: string
        postalCode:
          type: integer
        registerDate:
          type: string
          format: date
        disabledAccess:
          type: boolean
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
    StationInDto:
      allOf:
        - $ref: '#/components/schemas/Station'
      type: object
    StationOutDto:
      allOf:
        - $ref: '#/components/schemas/Station'
      type: object
    Driver:
      type: object
      required:
        - name
        - surname
        - licenseCategory
        - type
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        licenseCategory:
          type: string
        birthDate:
          type: string
          format: date
        type:
          type: string
        experience:
          type: integer
        height:
          type: number
          format: float
        active:
          type: boolean
    DriverInDto:
      allOf:
        - $ref: '#/components/schemas/Driver'
      type: object
    DriverOutDto:
      allOf:
        - $ref: '#/components/schemas/Driver'
      type: object
    Feedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        rating:
          type: number
          format: float
        comment:
          type: string
        registerDate:
          type: string
          format: date
        visible:
          type: boolean
        helpfulCount:
          type: integer
        recommend:
          type: boolean
    FeedbackInDto:
      type: object
      properties:
        rating:
          type: number
          format: float
        comment:
          type: string
        registerDate:
          type: string
          format: date
        visible:
          type: boolean
        helpfulCount:
          type: integer
        recommend:
          type: boolean
        routeId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
    FeedbackModifyInDto:
      allOf:
        - $ref: '#/components/schemas/FeedbackInDto'
      type: object
    FeedbackOutDto:
      allOf:
        - $ref: '#/components/schemas/Feedback'
      type: object
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        telephoneNumber:
          type: integer
        active:
          type: boolean
    UserInDto:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
    UserOutDto:
      allOf:
        - $ref: '#/components/schemas/User'
      type: object
    BadRequest:
      type: object
      properties:
        code:
          type: integer
        title:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    NotFound:
      type: object
      properties:
        code:
          type: integer
        title:
          type: string
        message:
          type: string
    InternalServerError:
      type: object
      properties:
        code:
          type: integer
        title:
          type: string
        message:
          type: string
