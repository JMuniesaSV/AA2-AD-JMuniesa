name: Postman Integration Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: transportFleet_database
          MARIADB_USER: transportFleet_user
          MARIADB_PASSWORD: transportFleet_password
        ports:
          - 3308:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Start Spring Boot app
      run: |
        java -jar target/transportFleet-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod &
        sleep 25 # Wait for Spring Boot to start
        
    - name: Install Newman
      run: npm install -g newman
      
    - name: Run Postman Tests
      run: newman run postman-tests.json
